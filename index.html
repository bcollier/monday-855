<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monday, 8:55</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1f24;
    }
    canvas {
      display: block;
      border-radius: 6px;
      /* Scale the 960x640 canvas down (keeping its shape) when the window is smaller.
         Without this, a short window crops the top and the page can't scroll,
         because input.js blocks Space/arrow scrolling. Only the display size changes;
         the game still draws at 960x640, and it's keyboard-only, so no click math breaks. */
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="960" height="640"></canvas>

  <!-- Plain scripts, NOT ES modules: modules are blocked when index.html is opened
       straight from disk (file://), which AC #1 requires to work.
       Order matters: each file only uses things defined in files above it. -->
  <script src="js/constants.js"></script>
  <script src="js/input.js"></script>
  <script src="js/door.js"></script>
  <script src="js/person.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
