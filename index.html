<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monday, 8:55</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b1c22;
    }
    canvas {
      display: block;
      /* The canvas draws at 960 x 640 game units (times the screen's pixel density).
         Here it is shown at 960 x 640, or scaled down to fit a smaller window while
         keeping its shape. Keyboard-only, so no click math depends on this. */
      width: min(960px, 100vw, 150vh);
      aspect-ratio: 3 / 2;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="960" height="640"></canvas>

  <!-- Plain scripts, NOT ES modules: modules are blocked when index.html is opened
       straight from disk (file://), which AC #1 requires to work.
       Order matters: each file only uses things defined in files above it
       when it first runs. -->
  <script src="js/constants.js"></script>
  <script src="js/input.js"></script>
  <script src="js/door.js"></script>
  <script src="js/person.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/game.js"></script>
  <script src="js/autopilot.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/render/art.js"></script>
  <script src="js/render/layout.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/render/scene.js"></script>
  <script src="js/render/doorway.js"></script>
  <script src="js/render/characters.js"></script>
  <script src="js/render/effects.js"></script>
  <script src="js/render/meter.js"></script>
  <script src="js/render/hud.js"></script>
  <script src="js/render/screens.js"></script>
  <script src="js/render/frame.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
